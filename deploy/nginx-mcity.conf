# MCITY.UZ — nginx konfiguratsiyasi
#
# Joyi: /etc/nginx/sites-available/mcity
# Ulash: sudo ln -s /etc/nginx/sites-available/mcity /etc/nginx/sites-enabled/mcity
#
# ESLATMA: bu faylda HTTPS bloki yo'q — uni certbot o'zi qo'shadi.
# Avval shu faylni qo'ying, nginx'ni ishga tushiring, keyin:
#   sudo certbot --nginx -d mcity.uz -d www.mcity.uz

# Node serveriga yo'naltirish manzili
upstream mcity_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcity.uz www.mcity.uz;

    # Yuklanadigan PDF katalog uchun joy (admin paneldan Supabase'ga
    # yuklanadi, lekin katta fayl yuborilsa nginx to'sib qo'ymasin)
    client_max_body_size 60m;

    # Gzip — HTML/CSS/JS hajmini kamaytiradi
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/xml image/svg+xml application/ld+json;

    # Vite hashlangan fayllari — nginx ularni to'g'ridan-to'g'ri beradi,
    # Node'ga umuman tegmaydi (tezroq va serverga yuk tushmaydi)
    location /assets/ {
        alias /opt/mcity/app/.output/public/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    location / {
        proxy_pass http://mcity_app;
        proxy_http_version 1.1;

        # MUHIM: bularsiz sayt o'zini qaysi domende ekanini bilmaydi va
        # www -> mcity.uz hamda http -> https yo'naltirishlari buziladi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location @app {
        proxy_pass http://mcity_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Let's Encrypt tekshiruvi uchun
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
